<div class="layout" [class.no-sidebar]="router.url === '/login' || router.url === '/register'">
  <header class="header"></header>

  @if (router.url !== "/login" && router.url !== "/register") {
    <sidebar class="sidebar"></sidebar>
  }

  <main class="content">
    @if (router.url === '/') {
      <banner class="content-banner"></banner>
    }

    <section class="content-body">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
