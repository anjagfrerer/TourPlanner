<div class="min-h-screen flex items-start justify-center">
  <div class="bg-white rounded-md shadow-lg p-8 mt-32 w-full max-w-md">    
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-[#283618]">Welcome back!</h2>
      <p class="text-sm text-[#283618]/70 mt-1">Please log in to your account.</p>
    </div>

    <form (submit)="onLogin($event)" class="space-y-5">
      
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[#283618] mb-2">Username</label>
        <input 
          type="text" 
          [value]="username()" 
          (input)="username.set($any($event.target).value)"
          required
          class="w-full px-4 py-3 rounded-lg border border-[#9AA672]/40 bg-[#fefae0]/30 focus:outline-none focus:border-[#283618] focus:ring-1 focus:ring-[#283618] transition"
          placeholder="username">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[#283618] mb-2">Password</label>
        <input 
          type="password" 
          [value]="password()" 
          (input)="password.set($any($event.target).value)"
          required
          class="w-full px-4 py-3 rounded-lg border border-[#9AA672]/40 bg-[#fefae0]/30 focus:outline-none focus:border-[#283618] focus:ring-1 focus:ring-[#283618] transition"
          placeholder="••••••••">
      </div>

      @if (errorMessage()) {
        <p class="text-xs text-red-600 font-medium text-center bg-red-50 py-2 rounded border border-red-200 mt-1">
        {{ errorMessage() }}
        </p>
      }

      <button 
        type="submit" 
        [disabled]="!username() || !password()"
        class="w-full bg-[#283618] text-[#fefae0] py-3 rounded-lg font-medium hover:bg-[#9AA672] disabled:opacity-50 disabled:hover:bg-[#283618] transition mt-2">
        Log In
      </button>

      <p class="text-sm text-center">No Account? <a class="underline" routerLink="/register" routerLinkActive="active">Register</a></p>
    </form>
  </div>
</div>
