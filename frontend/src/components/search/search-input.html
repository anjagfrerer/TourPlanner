<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="ml-auto w-[20vw] min-w-[200px] flex items-center gap-2 bg-accent rounded-4xl p-2 m-5 text-center">
    <input #searchInput (keydown.enter)="onSearch(searchInput.value)" class="bg-white rounded-4xl p-2 w-full text-sm" type="text" placeholder="Search">
    <span (click)="onSearch(searchInput.value)" class="material-icons text-white select-none cursor-pointer">search</span>
    
    <div class="relative flex items-center">
        <span (click)="toggleDropdown()" class="material-icons text-white select-none pr-1 cursor-pointer hover:text-gray-200 transition-colors">
            filter_alt
        </span>

        @if (isDropdownOpen()) {
            <div class="absolute top-full right-0 mt-2 bg-white text-left text-gray-800 border border-gray-200 rounded-xl shadow-xl min-w-[260px] z-50 overflow-hidden p-3 space-y-3">
                
                <div>
                    <div class="px-1 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Activity</div>
                    <div class="space-y-1">
                        <label class="px-2 py-1 hover:bg-gray-50 rounded-lg cursor-pointer text-sm flex items-center justify-between">
                            <span class="flex items-center gap-2">🌍 All Types</span>
                            <input type="radio" name="transport" [checked]="selectedTransport() === ''" (change)="selectTransport('')" class="text-blue-600 cursor-pointer" />
                        </label>
                        
                        <label class="px-2 py-1 hover:bg-gray-50 rounded-lg cursor-pointer text-sm flex items-center justify-between">
                            <span class="flex items-center gap-2">🚲 Bike</span>
                            <input type="radio" name="transport" [checked]="selectedTransport() === 'BIKING'" (change)="selectTransport('BIKING')" class="text-blue-600 cursor-pointer" />
                        </label>
                        
                        <label class="px-2 py-1 hover:bg-gray-50 rounded-lg cursor-pointer text-sm flex items-center justify-between">
                            <span class="flex items-center gap-2">🥾 Hike</span>
                            <input type="radio" name="transport" [checked]="selectedTransport() === 'HIKING'" (change)="selectTransport('HIKING')" class="text-blue-600 cursor-pointer" />
                        </label>
                        
                        <label class="px-2 py-1 hover:bg-gray-50 rounded-lg cursor-pointer text-sm flex items-center justify-between">
                            <span class="flex items-center gap-2">🏃 Running</span>
                            <input type="radio" name="transport" [checked]="selectedTransport() === 'RUNNING'" (change)="selectTransport('RUNNING')" class="text-blue-600 cursor-pointer" />
                        </label>
                        
                        <label class="px-2 py-1 hover:bg-gray-50 rounded-lg cursor-pointer text-sm flex items-center justify-between">
                            <span class="flex items-center gap-2">📅 Vacation</span>
                            <input type="radio" name="transport" [checked]="selectedTransport() === 'VACATION'" (change)="selectTransport('VACATION')" class="text-blue-600 cursor-pointer" />
                        </label>
                    </div>
                </div>

                <div>
                    <div class="px-1 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Rating</div>
                    <div class="space-y-1">
                        @for (stars of [5, 4, 3, 2, 1]; track stars) {
                            <label class="px-2 py-0.5 hover:bg-gray-50 rounded-lg cursor-pointer flex items-center justify-between">
                                <div class="flex items-center text-lg">
                                    @for (i of [1, 2, 3, 4, 5]; track i) {
                                        <span [class.text-amber-400]="i <= stars" [class.text-gray-200]="i > stars">★</span>
                                    }
                                </div>
                                <input type="checkbox" [checked]="isRatingSelected(stars)" (change)="toggleRating(stars)" class="rounded text-amber-500 cursor-pointer" />
                            </label>
                        }
                    </div>
                </div>

                <div>
                    <div class="px-1 text-xs font-semibold text-gray-400 uppercase tracking-wider flex justify-between">
                        <span>Max. Distance</span>
                        <span class="text-blue-600 font-bold">{{ maxDistance() }} km</span>
                    </div>
                    <input type="range" min="1" [max]="distanceLimit()" [value]="maxDistance()" 
                           (input)="maxDistance.set($any($event.target).valueAsNumber)" (change)="applyFilter()"
                           class="w-full h-1 bg-gray-200 rounded-lg cursor-pointer accent-blue-600 mt-1">
                </div>

                <div>
                    <div class="px-1 text-xs font-semibold text-gray-400 uppercase tracking-wider flex justify-between">
                        <span>Max. Duration</span>
                        <span class="text-blue-600 font-bold">{{ maxDuration() }} h</span>
                    </div>
                    <input type="range" min="1" [max]="durationLimit()" [value]="maxDuration()" 
                           (input)="maxDuration.set($any($event.target).valueAsNumber)" (change)="applyFilter()"
                           class="w-full h-1 bg-gray-200 rounded-lg cursor-pointer accent-blue-600 mt-1">
                </div>

                <div class="border-t border-gray-100 pt-2 flex items-center justify-between text-xs">
                    <button (click)="clearFilters()" class="text-red-500 hover:bg-red-50 p-1 rounded cursor-pointer">✕ Clear</button>
                    <button (click)="toggleDropdown()" class="bg-amber-500 text-white px-3 py-1 rounded shadow-sm hover:bg-amber-600">Done</button>
                </div>
            </div>
        }
    </div>
</div>
