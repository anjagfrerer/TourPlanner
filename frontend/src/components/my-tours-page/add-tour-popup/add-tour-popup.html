<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <!-- Modal -->
  <div class="w-full max-w-2xl rounded-2xl bg-secondary p-6 shadow-xl text-white">
    <div class="mb-4 flex items-center justify-between border-b pb-2">
      <h2 class="text-xl font-semibold">Add new Tour</h2>
      <button type="button" (click)="onCancel()" class="text-gray-500 hover:text-accent text-2xl px-2">✕</button>
    </div>

    <form (submit)="onSubmit($event)" class="space-y-4">
      <div class="grid grid-cols-1 gap-4">
        <div>
          <label class="block text-sm font-medium">Name</label>
          <input type="text" name="Name" [value]="vm.form().name" (input)="vm.updateName($event)" class="w-full border rounded-md p-2" required />
        </div>
        <div>
          <label class="block text-sm font-medium">Description</label>
          <textarea
            rows="3"
            name="Description"
            [value]="vm.form().description"
            (input)="vm.updateDescription($event)"
            class="w-full border rounded-md p-2"
            required>
          </textarea>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium">From</label>
          <input type="text" name="From" [value]="vm.form().startLocation" (input)="vm.updateStartLocation($event)" class="w-full border rounded-md p-2" required />
        </div>
        <div>
          <label class="block text-sm font-medium">To</label>
          <input type="text" name="To" [value]="vm.form().destinationLocation" (input)="vm.updateDestinationLocation($event)" class="w-full border rounded-md p-2" required />
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium">Transport Type</label>
          <select name="TransportType" [value]="vm.form().transportType" (change)="vm.updateTransportType($event)" class="w-full border rounded-md p-2" required>
            @for (transportType of vm.transportTypes; track transportType) {
              <option [value]="transportType">{{ transportType }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium">Rating</label>
          <input type="number" min="0" max="5" name="Rating" [value]="vm.form().rating" (input)="vm.updateRating($event)" class="w-full border rounded-md p-2" required />
        </div>
        <div class="flex items-end">
          @if (vm.saveStatus() === 'error') {
            <p class="text-sm text-red-600">Could not save tour.</p>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t">
        <button type="button" (click)="onCancel()" class="px-4 py-2 border rounded-xl hover:bg-gray-100 transition-colors">
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-accent text-white rounded-xl font-bold hover:bg-blue-700 transition-colors disabled:opacity-60"
          [disabled]="vm.saveStatus() === 'saving'">
          {{ vm.saveStatus() === 'saving' ? 'Saving...' : 'Add Tour' }}
        </button>
      </div>
    </form>
  </div>
</div>
